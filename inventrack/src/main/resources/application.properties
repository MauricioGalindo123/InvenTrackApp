spring.application.name=inventrack

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventrack}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# Mostrar el mensaje de error en las respuestas (en produccion Spring lo oculta por defecto)
spring.web.error.include-message=always

# Seguridad: token JWT (HS256). En produccion definir JWT_SECRET con una clave propia de 32 caracteres o mas.
jwt.secret=${JWT_SECRET:inventrack-clave-de-desarrollo-2026-cambiar-en-produccion}
jwt.expiracion-horas=${JWT_EXPIRACION_HORAS:2}

# Almacén móvil: sesiones persistentes independientes del JWT del proyecto académico.
mobile.enabled=${MOBILE_ENABLED:true}
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
